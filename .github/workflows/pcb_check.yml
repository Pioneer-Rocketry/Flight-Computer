name: Check and generate PCB production files

on:
  push:
    paths:
      - "PCB/*.kicad_*"
    paths-ignore::
      - "**.md"
      - "PCB/Output/*"
      - "Datasheets/**"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check-generate-pcb-production:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/kicad/kicad:10.0.4-full

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version Info
        run: kicad-cli --version

      - name: Run KiCad Jobset
        run: cd PCB && kicad-cli jobset run --file Fabrication.kicad Flight\ Computer.kicad_pcb

      # https://stackoverflow.com/a/58393457
      - name: Commit build artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add PCB/Output/*
          git commit -m "Add PCB production files" || echo "No changes to commit"
          git push

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flight-computer-build
          path: |
            PCB/Output/bom.html
            PCB/Output/Flight\ Computer.csv
            PCB/Output/Flight\ Computer-drc.rpt
            PCB/Output/Flight\ Computer-erc.rpt
            PCB/Output/Flight\ Computer.pdf
            PCB/Output/Flight\ Computer.step
            PCB/Output/Gerber.zip